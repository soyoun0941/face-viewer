
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Face Structure Visualizer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    video, canvas {
      width: 640px;
      height: 480px;
      margin: 20px auto;
      display: block;
      border: 1px solid #ccc;
    }

    #info {
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Face Structure Visualizer</h1>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="output"></canvas>
  <div id="info"></div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('output');
    const canvasCtx = canvasElement.getContext('2d');
    const infoElement = document.getElementById('info');

    const faceMesh = new FaceMesh({
      locateFile: (file) => \`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/\${file}\`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 640,
      height: 480
    });
    camera.start();

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      if (results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        canvasCtx.beginPath();
        for (const landmark of landmarks) {
          const x = landmark.x * canvasElement.width;
          const y = landmark.y * canvasElement.height;
          canvasCtx.moveTo(x, y);
          canvasCtx.arc(x, y, 1, 0, 2 * Math.PI);
        }
        canvasCtx.fill();

        const leftEye = landmarks[33];  // right eye from viewer's perspective
        const rightEye = landmarks[263];  // left eye
        const noseTip = landmarks[1];
        const mouth = landmarks[13];

        const eyeDist = Math.hypot(rightEye.x - leftEye.x, rightEye.y - leftEye.y).toFixed(3);
        const noseMouthDist = Math.hypot(mouth.x - noseTip.x, mouth.y - noseTip.y).toFixed(3);

        infoElement.innerHTML = \`
          👁️ Eye Distance: \${eyeDist}<br/>
          👃 Nose to Mouth: \${noseMouthDist}
        \`;
      }
      canvasCtx.restore();
    }
  </script>
</body>
</html>
